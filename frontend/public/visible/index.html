<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visible · Art of Living in AI search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAF9F6; --panel: #ffffff; --ink: #1C1917; --ink2: #57534E; --muted: #78716C; --line: #E7E5E4; --line2: #F5F5F4; --line3: #D6D3D1;
  --accent: #B45309; --accent-hover: #92400E; --amber: #D97706; --amber-50: #FFFBEB; --amber-100: #FEF3C7; --amber-900: #78350F; --amber-700: #B45309;
  --accent-soft: #FEF3C7; --good: #16A34A; --good-soft: #DCFCE7; --bad: #DC2626; --bad-soft: #FEE2E2;
  --teal: #0D9488; --teal-soft: #CCFBF1; --sim: #0284C7; --sim-soft: #E0F2FE; --track: #F5F5F4; --other: #D6D3D1;
  --shadow: none;
}
:root { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 "DM Sans", -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
h1, h2, h3, .brand, .kpi .v, .big, .card > h3, .ch, .evc .t, .task .t { font-family: "Plus Jakarta Sans", -apple-system, sans-serif; }
:focus-visible { outline: 3px solid #0284c7; outline-offset: 2px; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
section.page:not([hidden]) > * { animation: rise .5s ease-out both; }
@media (prefers-reduced-motion: reduce) { section.page > * { animation: none !important; } }
a { color: var(--accent); text-decoration: none; }
header.top { position: sticky; top: 0; z-index: 40; background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: 0 1px 2px rgba(28,25,23,.04); }
header.top .in { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 24px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 99px; padding: 3px; }
.lang span { border-radius: 99px; padding: 3px 12px; font-size: 13px; font-weight: 600; color: var(--ink2); }
.lang span.on { background: var(--amber-100); color: var(--amber-900); }
.hright { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
.app { display: grid; grid-template-columns: 240px 1fr; max-width: 1400px; margin: 0 auto; gap: 24px; padding: 0 24px; }
aside.side { padding: 28px 0; position: sticky; top: 66px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
.brand { display: flex; align-items: center; gap: 12px; color: var(--ink); font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
.brand svg { width: 36px; height: 36px; flex: none; }
.brand .nm { border-left: 1px solid var(--line); padding-left: 12px; line-height: 1.2; }
.brand small { display: block; font-family: "DM Sans", sans-serif; font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; }
.navgroup { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .18em; color: var(--muted); padding: 18px 12px 6px; }
.navgroup:first-child { padding-top: 0; }
nav a { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; color: var(--ink2); font-weight: 500; font-size: 14px; white-space: nowrap; transition: background-color .15s, color .15s; }
nav a svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav a:hover { background: var(--line2); color: var(--ink); }
nav a.on { background: var(--amber-50); color: var(--amber-900); }
nav a.on svg { color: var(--amber-700); }
nav a .badge { margin-left: auto; font-size: 11px; font-style: normal; font-weight: 600; background: var(--amber-100); color: var(--amber-900); border-radius: 99px; padding: 0 8px; }
.sidefoot { font-size: 12px; padding: 18px 12px 0; color: var(--muted); }
main { padding: 32px 0 64px; min-width: 0; }
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.ph .eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .18em; color: var(--amber-700); margin: 0 0 6px; }
.ph h1 { font-size: 30px; font-weight: 600; margin: 0; letter-spacing: -.025em; line-height: 1.2; }
.ph p.sub { margin: 6px 0 0; color: var(--ink2); max-width: 640px; }
section.page[hidden] { display: none; }
.g { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g12 { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; min-width: 0; }
.card > h3, .ch { margin: 0 0 16px; font-size: 15px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.ch .r { font-weight: 500; color: var(--muted); font-size: 12px; }
.kpi .l { font-size: 13px; color: var(--ink2); font-weight: 500; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.kpi .v { font-size: 36px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1; margin-top: 10px; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 15px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.kpi .s { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.meter { height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; margin-top: 14px; }
.meter > div { height: 100%; border-radius: 99px; background: var(--amber); }
.meter.good > div { background: var(--good); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 99px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.tag.real { background: var(--good-soft); color: var(--good); }
.tag.sim { background: var(--sim-soft); color: var(--sim); }
.tag.draft { background: var(--accent-soft); color: var(--accent); }
.muted { color: var(--muted); } .small { font-size: 12.5px; }
.yes { color: var(--good); font-weight: 600; } .no { color: var(--bad); font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.g { background: var(--good); } .dot.b { background: var(--bad); } .dot.a { background: var(--accent); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--ink2); text-transform: uppercase; letter-spacing: .08em; padding: 10px; background: var(--line2); }
th:first-child { border-radius: 8px 0 0 8px; } th:last-child { border-radius: 0 8px 8px 0; }
tr:hover td { background: #fafaf9; }
td { padding: 11px 10px; border-bottom: 1px solid var(--line2); vertical-align: middle; transition: background-color .15s; }
tr:last-child td { border-bottom: 0; }
.tw { overflow-x: auto; margin: 0 -10px; }
.minibar { display: flex; align-items: center; gap: 10px; min-width: 120px; }
.minibar .t { flex: 1; height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; }
.minibar .t div { height: 100%; background: var(--teal); }
.minibar span { font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--ink2); width: 42px; text-align: right; }
.bars .row { display: grid; grid-template-columns: 110px 1fr 34px; gap: 10px; align-items: center; margin: 9px 0; font-size: 13px; }
.bars .track { height: 10px; background: var(--track); border-radius: 99px; overflow: hidden; }
.bars .fill { height: 100%; border-radius: 99px; background: var(--other); }
.bars .fill.listing { background: var(--amber); }
.bars .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink2); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.pmap { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 8px; }
.prov { border-radius: 12px; padding: 10px 2px; text-align: center; font-size: 11px; line-height: 1.25; aspect-ratio: 1 / .82; display: flex; flex-direction: column; justify-content: center; }
.prov b { font-size: 14px; }
.prov.zero { background: var(--bad-soft); color: var(--bad); }
.prov.some { background: var(--amber-100); color: var(--amber-900); }
.prov.good { background: var(--good-soft); color: var(--good); }
.prov.none { background: var(--line2); color: var(--muted); }
.prov.blank { visibility: hidden; }
.list .it { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line2); }
.list .it:last-child { border-bottom: 0; }
.list .it b { font-weight: 600; }
.chip { font-size: 12px; background: var(--line2); color: var(--ink2); border-radius: 99px; padding: 2px 7px; white-space: nowrap; display: inline-block; margin: 1px 2px 1px 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 99px; padding: 8px 16px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid var(--line3); background: var(--panel); color: var(--ink); white-space: nowrap; transition: background-color .15s; }
.btn:hover:not(:disabled) { background: var(--line2); }
.btn.p { background: var(--accent); border-color: var(--accent); color: #fff; padding: 9px 18px; }
.btn.p:hover:not(:disabled) { background: var(--accent-hover); }
.btn.s { padding: 5px 10px; font-size: 12.5px; font-weight: 500; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
input[type=text], input[type=number], input[type=datetime-local], select, textarea { font: inherit; font-size: 14px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line3); background: var(--panel); color: var(--ink); min-width: 0; width: 100%; transition: border-color .15s; }
input:focus, select:focus, textarea:focus { border-color: var(--amber); outline: none; }
textarea { min-height: 170px; resize: vertical; line-height: 1.5; }
.search { display: flex; gap: 8px; }
.search input { flex: 1; }
.fl { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--ink2); }
.form { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.fl > input, .fl > select, .fl > textarea, .form > input, .form > select { font-weight: 400; }
.form .full { grid-column: 1 / -1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 18px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; font: inherit; font-weight: 600; font-size: 13px; padding: 5px 14px; border-radius: 99px; color: var(--ink2); cursor: pointer; transition: background-color .15s; }
.seg button.on { background: var(--amber-100); color: var(--amber-900); }
.task { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--line2); }
.task:last-child { border-bottom: 0; }
.task input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--amber-700); }
.task .t { font-weight: 600; }
.task .m { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.pill { font-size: 11.5px; border-radius: 99px; padding: 1px 9px; background: var(--line2); color: var(--ink2); }
.pill.easy { background: var(--teal-soft); color: var(--teal); font-weight: 600; }
.reach { text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
.reach b { display: block; font-size: 16px; color: var(--ink); }
details > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; list-style: none; margin-top: 6px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸ "; }
details[open] > summary::before { content: "▾ "; }
details ol { margin: 6px 0 0; padding-left: 18px; color: var(--ink2); font-size: 13px; }
.sticky { position: sticky; top: 20px; }
.big { font-size: 44px; font-weight: 700; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.compare { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.compare .row { display: grid; grid-template-columns: 64px 1fr 40px; gap: 10px; align-items: center; font-size: 12.5px; }
.approve { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: 10px; background: var(--good-soft); margin-bottom: 14px; }
.approve label { display: flex; gap: 8px; align-items: center; font-weight: 600; color: var(--good); }
.approve input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--good); }
.approve input[type=text] { width: 170px; }
.why { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; margin: 4px 0 12px; }
.cnt { font-weight: 500; color: var(--muted); font-size: 11.5px; } .cnt.bad { color: var(--bad); font-weight: 600; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.ok { color: var(--good); font-weight: 600; } .err { color: var(--bad); }
.empty { text-align: center; padding: 34px 10px; color: var(--muted); }
.evc .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.evc .t { font-weight: 600; font-size: 15px; }
.ring { --p: 0; width: 64px; height: 64px; border-radius: 50%; background: conic-gradient(var(--teal) calc(var(--p) * 1%), var(--track) 0); display: grid; place-items: center; flex: none; }
.ring div { width: 50px; height: 50px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.answer { background: var(--line2); border-radius: 10px; padding: 12px 14px; white-space: pre-line; margin-top: 10px; max-height: 300px; overflow: auto; }
mark { background: var(--good-soft); color: var(--good); border-radius: 3px; padding: 0 2px; }
pre { background: var(--line2); border-radius: 10px; padding: 12px; overflow: auto; font-size: 12px; max-height: 340px; white-space: pre-wrap; word-break: break-word; margin: 8px 0; }
.faq p { margin: 0 0 12px; } .faq b { display: block; }
.res { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.res .card { display: flex; flex-direction: column; gap: 6px; }
.res .lvl { font-size: 11.5px; color: var(--amber-700); font-weight: 600; text-transform: uppercase; letter-spacing: .12em; }
.spark text { fill: var(--muted); font-size: 11px; font-family: inherit; }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g21, .g12 { grid-template-columns: 1fr; } .sticky { position: static; } }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; padding: 0 16px; gap: 0; }
  header.top .in { padding: 10px 16px; } .brand small, .hright .when { display: none; }
  aside.side { position: sticky; top: 57px; z-index: 30; background: var(--bg); flex-direction: row; overflow-x: auto; padding: 8px 0; margin: 0 -16px; padding-left: 16px; border-bottom: 1px solid var(--line); }
  .navgroup, .sidefoot, nav a .badge { display: none; }
  nav { display: flex; gap: 2px; } nav a { padding: 7px 10px; } nav a span { display: none; } nav a.on span { display: inline; }
  main { padding: 20px 0 48px; }
  .ph h1 { font-size: 24px; }
  .g3, .g2 { grid-template-columns: 1fr; } .form { grid-template-columns: 1fr; }
  .prov { font-size: 9px; padding: 4px 1px; } .prov b { font-size: 11px; }
  .kpi .v { font-size: 28px; }
}
@media (max-width: 480px) { .g4 { grid-template-columns: 1fr 1fr; gap: 10px; } .card { padding: 14px; } .bars .row { grid-template-columns: 90px 1fr 28px; } }
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="8" fill="#D97706"/><g stroke="#D97706" stroke-width="2.4" stroke-linecap="round"><path d="M20 3v5M20 32v5M3 20h5M32 20h5M8 8l3.5 3.5M28.5 28.5L32 32M8 32l3.5-3.5M28.5 11.5L32 8"/></g></svg><div class="nm">Visible<small>Art of Living Canada · AI search</small></div></div>
  <div class="hright"><span class="when" id="when"></span><a class="btn p" href="#post" style="padding:7px 16px">+ Post an event</a></div>
</div></header>
<div class="app">
<aside class="side">
  <nav id="nav"></nav>
  <div class="sidefoot" id="foot"></div>
</aside>
<main>
  <section class="page" id="pg-overview"></section>
  <section class="page" id="pg-cities" hidden></section>
  <section class="page" id="pg-actions" hidden></section>
  <section class="page" id="pg-post" hidden></section>
  <section class="page" id="pg-events" hidden></section>
  <section class="page" id="pg-materials" hidden></section>
  <section class="page" id="pg-finder" hidden></section>
  <section class="page" id="pg-progress" hidden></section>
</main>
</div>
<script>window.VISIBLE_STATIC = true;</script>
<script>
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const STATIC = !!window.VISIBLE_STATIC;
const MEASURED = '<span class="tag real">Measured</span>';
const ESTIMATE = '<span class="tag sim">Estimate</span>';
const date = (iso) => new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
const pct = (a, b) => (b ? Math.round((100 * a) / b) : 0);
let S, latest;

const ICON = {
  overview: '<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  cities: '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  actions: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
  post: '<path d="M12 5v14M5 12h14"/>',
  events: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  materials: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  finder: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  progress: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
};
const PAGES = [
  ['overview', 'Overview', 'See'], ['cities', 'Cities'], ['actions', 'Actions'],
  ['post', 'Post an event', 'Act'], ['events', 'My events'], ['materials', 'Materials'],
  ['finder', 'Program finder', 'Tools'], ['progress', 'Progress'],
];

function nav() {
  $('#nav').innerHTML = PAGES.map(([id, name, group]) => `${group ? `<div class="navgroup">${group}</div>` : ''}<a href="#${id}" data-p="${id}"><svg viewBox="0 0 24 24">${ICON[id]}</svg><span>${name}</span>${id === 'events' ? `<em class="badge" id="evcount"></em>` : ''}</a>`).join('');
}
function go() {
  const id = (location.hash.slice(1) || 'overview').split('/')[0];
  const page = PAGES.some((p) => p[0] === id) ? id : 'overview';
  $$('section.page').forEach((s) => (s.hidden = s.id !== 'pg-' + page));
  $$('#nav a').forEach((a) => a.classList.toggle('on', a.dataset.p === page));
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', go);
const head = (title, sub, right = '', eyebrow = '') => `<div class="ph"><div>${eyebrow ? `<p class="eyebrow">${eyebrow}</p>` : ''}<h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div>${right}</div>`;

// ---------- Overview ----------
const PROVINCES = [
  ['', '', '', '', '', '', '', '', 'NL'],
  ['BC', 'AB', 'SK', 'MB', 'ON', 'QC', '', 'NB', 'PE'],
  ['', '', '', '', '', '', '', 'NS', ''],
];
const PNAME = { BC: 'British Columbia', AB: 'Alberta', SK: 'Saskatchewan', MB: 'Manitoba', ON: 'Ontario', QC: 'Québec', NB: 'New Brunswick', NS: 'Nova Scotia', PE: 'PEI', NL: 'Newfoundland' };
function provinceMap(byProv) {
  const cell = (p) => {
    if (!p) return '<div class="prov blank"></div>';
    const v = byProv[p];
    if (!v) return `<div class="prov none" title="${PNAME[p]}"><b>${p}</b>–</div>`;
    const cls = v.mentioned === 0 ? 'zero' : v.mentioned / v.total < 0.5 ? 'some' : 'good';
    return `<div class="prov ${cls}" title="${PNAME[p]}: found in ${v.mentioned} of ${v.total}"><b>${p}</b>${v.mentioned}/${v.total}</div>`;
  };
  return `<div class="pmap">${PROVINCES.flat().map(cell).join('')}</div>
    <div class="legend"><span><i class="sw" style="background:var(--bad-soft);border:1px solid var(--bad)"></i>Never found</span><span><i class="sw" style="background:var(--accent-soft);border:1px solid var(--accent)"></i>Sometimes</span><span><i class="sw" style="background:var(--good-soft);border:1px solid var(--good)"></i>Often</span></div>`;
}
function sourceBars(n = 7) {
  const top = latest.topSources.filter((s) => s.kind !== 'other').slice(0, n);

const VERDICT = { matches: ['✓', 'yes', 'Correct'], wrong: ['✗', 'no', 'Wrong'], not_in_our_facts: ['?', 'muted', 'Not in our facts'] };
async function ask() {
  const q = $('#askq').value.trim();
  if (!q) return;
  $('#askgo').disabled = true;
  $('#askout').className = 'small';
  $('#askout').textContent = 'Asking… about 20 seconds.';
  try {
    const r = await fetch('api/ask', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ question: q }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error ?? 'Something went wrong');
    $('#askout').innerHTML = `<div class="${j.mentioned ? 'yes' : 'no'}" style="font-size:15px">${j.mentioned ? '✓ Art of Living came up' : '✗ Art of Living did not come up'}</div>
      <div class="answer">${highlight(j.answer)}</div>
      <div style="margin-top:10px">${j.sources.map((d) => `<span class="chip">${esc(d)}</span>`).join('')}</div>
      ${j.accuracy?.claims?.length ? `<div style="margin-top:10px">${j.accuracy.claims.map((c) => `<div style="margin:4px 0"><span class="${VERDICT[c.verdict][1]}">${VERDICT[c.verdict][0]} ${VERDICT[c.verdict][2]}</span> · ${esc(c.claim)}</div>`).join('')}</div>` : ''}`;
  } catch (e) {
    $('#askout').textContent = e.message;
  } finally {
    $('#askgo').disabled = false;
  }
}

// ---------- Actions ----------
function projected(selected) {
  const unb = S.runs[0].queries.filter((q) => !q.branded);
  let e = 0;
  for (const q of unb) {
    if (q.mentioned) { e++; continue; }
    e += 1 - selected.filter((a) => a.queryIds.includes(q.id)).reduce((m, a) => m * (1 - a.p), 1);
  }
  return Math.round(e);
}

function approved() { return $('#rv')?.checked && ($('#rn')?.value.trim().length ?? 0) > 1; }
function drawPkg() {

  $('#pkgs').innerHTML = `

    if ($('#pt')) { p.title = $('#pt').value; $('#tc').textContent = `${p.title.length}/${p.titleMax}`; $('#tc').classList.toggle('bad', p.title.length > p.titleMax); }
    p.body = $('#pb').value;

async function addEvent(fields, msgSel) {
  if (!fields.url && !fields.title) { $(msgSel).innerHTML = '<span class="err">Add the event link first.</span>'; return; }
  if (STATIC) {
    let host = 'event'; try { host = new URL(fields.url).hostname.replace(/^www\./, ''); } catch {}
    saveLocal([...localEvents(), { id: 'local-' + Date.now().toString(36), ...fields, platform: host, addedAt: new Date().toISOString(), checks: [], local: true, report: 'Saved on this device. Not checked yet.' }]);
  } else {
    const r = await fetch('api/events', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(fields) });
    if (!r.ok) { $(msgSel).innerHTML = `<span class="err">${esc((await r.json()).error)}</span>`; return; }
  }
  $(msgSel).innerHTML = '<span class="ok">Tracking ✓</span> <a href="#events">Open My events →</a>';
  await reloadEvents();
}
async function reloadEvents() {
  if (!STATIC) S.events = (await (await fetch('api/state')).json()).events;
  renderEvents();
}

function pickEventClient(events, q) {
  const stop = ['how', 'the', 'doing', 'event', 'our', 'what', 'about', 'listing'];
  const words = q.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split(/[^a-z0-9]+/).filter((w) => w.length > 2 && !stop.includes(w));
  let best = null, score = 0;
  for (const e of events) {
    const hay = `${e.title} ${e.city} ${e.platform}`.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const s = words.filter((w) => hay.includes(w)).length;
    if (s > score) { best = e; score = s; }
  }
  return best ?? events.at(-1);
}

  $('#pg-events').innerHTML = head('My events', 'Do chatbots send people to your event? How many registered?', '', 'Act') + `
    <div class="card"><div class="search"><input type="text" id="eq" placeholder="Ask: how is the Québec retreat doing?"><button class="btn p" id="ego">Ask</button></div><div id="eout"></div></div>
    <div class="g g3" style="margin-top:16px">${evs.slice().reverse().map(eventCard).join('')}
      <div class="card"><div class="ch">Track a posted event</div>
        <div class="form" style="grid-template-columns:1fr"><input type="text" id="aname" placeholder="Event name"><input type="text" id="aurl" placeholder="Link"><input type="text" id="acity" placeholder="City">
        <select id="aprog">${S.catalog.programs.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
        <div class="row-btns"><button class="btn" id="ago">Track</button><span class="small" id="amsg"></span></div></div></div>`;
  const askEv = () => {
    const e = pickEventClient(allEvents(), $('#eq').value || '');
    $('#eout').innerHTML = e ? `<div style="margin-top:12px"><b>${esc(e.title)}</b> · ${esc(e.report)}</div>` : '';
  };
  $('#ego').onclick = askEv;
  $('#eq').onkeydown = (e) => e.key === 'Enter' && askEv();
  $('#ago').onclick = () => {
    const c = S.cities.find((x) => x.city === $('#acity').value.trim());
    addEvent({ title: $('#aname').value.trim(), url: $('#aurl').value.trim(), city: $('#acity').value.trim(), province: c?.province ?? '', programId: $('#aprog').value }, '#amsg');
  };
  $$('#pg-events [data-check]').forEach((b) => (b.onclick = async () => {
    const id = b.dataset.check; b.disabled = true; $('#cm-' + id).textContent = 'Checking… a minute or two.';
    const r = await fetch(`api/events/${id}/check`, { method: 'POST' });
    const j = await r.json();
    if (!r.ok) { $('#cm-' + id).innerHTML = `<span class="err">${esc(j.error)}</span>`; b.disabled = false; return; }
    await reloadEvents();
  }));
}

// ---------- Materials ----------
function renderMaterials() {
  const f = S.fixes;
  const plats = [...new Set(S.listings.map((l) => l.platform))];
  let tab = 'listings', plat = plats[0];
  const draw = () => {
    let body = '';
    if (tab === 'listings') {
      body = `<div class="seg" id="lseg" style="margin-bottom:12px">${plats.map((p) => `<button data-p="${esc(p)}" class="${p === plat ? 'on' : ''}">${esc(p)}</button>`).join('')}</div>
        <div class="tw"><table><tr><th>Listing</th><th></th></tr>${S.listings.map((l, i) => [l, i]).filter(([l]) => l.platform === plat).map(([l, i]) => `<tr><td><b>${esc(l.title)}</b><details><summary>Preview</summary><pre>${esc(l.body)}</pre><div>${l.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join('')}</div></details></td><td style="text-align:right"><button class="btn s" data-copy="${i}">Copy</button></td></tr>`).join('')}</table></div>`;
    } else if (tab === 'faq') {
      body = `<div class="faq">${f.faq.items.map((i) => `<p><b>${esc(i.question)}</b>${esc(i.answer)}</p>`).join('')}</div>`;
    } else if (tab === 'fr') {
      body = `<div class="faq">${S.faqFr.items.map((i) => `<p><b>${esc(i.question)}</b>${esc(i.answer)}</p>`).join('')}</div>`;
    } else if (tab === 'pages') {
      body = `<div class="list">${S.catalog.centres.map((c) => `<div class="it"><span class="dot a" style="margin-top:7px"></span><div style="flex:1"><b>${esc(c.name)}</b><div class="small muted">${esc(c.city)}</div></div><a class="btn s" href="fixes/city/${c.id}.html" target="_blank">Preview ↗</a></div>`).join('')}</div>`;
    } else {
      body = `<div class="small muted">Page titles and descriptions</div><pre>${esc(f.centres.map((c) => `${c.meta.url}\n  ${c.meta.title}\n  ${c.meta.description}`).join('\n\n'))}</pre>
        <div class="small muted">Course schema</div><pre>${esc(JSON.stringify([f.organization, ...f.courses], null, 2))}</pre>
        <div class="small muted">FAQ schema</div><pre>${esc(JSON.stringify(f.faq.jsonLd, null, 2))}</pre>
        <div class="small muted">llms.txt</div><pre>${esc(f.llmsTxt)}</pre>`;
    }
    $('#mbody').innerHTML = body;
  };
  $('#pg-materials').innerHTML = head('Materials', 'Written from our course list. Copy, check, post.', '', 'Act') + `
    <div class="card"><div class="ch"><div class="seg" id="mseg"><button class="on" data-t="listings">Listings</button><button data-t="faq">FAQ</button><button data-t="fr">Français</button><button data-t="pages">Centre pages</button><button data-t="tech">Website files</button></div>
      <span id="mtag"></span></div><div id="mbody"></div></div>`;
  const tags = { faq: '<span class="tag draft">Draft · teacher review</span>', fr: '<span class="tag draft">Brouillon · à vérifier</span>' };
  $('#pg-materials').onclick = (e) => {
    const t = e.target;
    if (t.dataset.t) { tab = t.dataset.t; $$('#mseg button').forEach((b) => b.classList.toggle('on', b === t)); $('#mtag').innerHTML = tags[tab] ?? ''; draw(); }
    if (t.dataset.p) { plat = t.dataset.p; draw(); }
    if (t.dataset.copy) { const l = S.listings[+t.dataset.copy]; navigator.clipboard?.writeText(`${l.title}\n\n${l.body}\n\nTags: ${l.tags.join(', ')}`).then(() => (t.textContent = 'Copied ✓'), () => {}); }
  };
  draw();
}

// ---------- Program finder ----------
function renderFinder() {
  $('#pg-finder').innerHTML = head('Program finder', 'The same official list chatbots can connect to.', '', 'Tools') + `
    <div class="card"><div class="search" style="flex-wrap:wrap"><input type="text" id="ftopic" placeholder="Need: anxiety, sleep…" value="anxiety"><input type="text" id="fcity" placeholder="City" value="Toronto" style="flex:0 1 200px"><button class="btn p" id="fgo">Find</button></div></div>
    <div id="fout" style="margin-top:16px"></div>
    <details style="margin-top:16px"><summary>Connect a chatbot (MCP)</summary><pre>{ "mcpServers": { "art-of-living": { "command": "node", "args": ["scripts/mcp-stdio.js"] } } }</pre><div class="small"><a href="feed.json">feed.json</a> · <a href="llms.txt">llms.txt</a></div></details>`;
  const run = async () => {
    const topic = $('#ftopic').value || undefined, city = $('#fcity').value || undefined;
    const out = STATIC ? (await import('./search.js')).findPrograms(S.catalog, { topic, city })
      : await (await fetch('api/programs?' + new URLSearchParams({ topic: topic ?? '', city: city ?? '' }))).json();
    $('#fout').innerHTML = `<div class="res">${out.programs.map((p) => `<div class="card"><span class="lvl">${esc(p.level)}</span><b>${esc(p.name)}</b><span class="small muted">${esc(p.description)}</span><a class="small" href="${esc(p.url)}" target="_blank" style="margin-top:auto">Official page ↗</a></div>`).join('') || '<div class="empty">No match</div>'}</div>
      ${out.centres.length ? `<div class="small" style="margin-top:12px"><b>Nearby:</b> ${out.centres.map((c) => `<a href="${esc(c.url)}" target="_blank">${esc(c.name)}</a>`).join(' · ')}</div>` : ''}`;
  };
  $('#fgo').onclick = run;
  run();
}

// ---------- Progress ----------
function renderProgress() {
  const runs = S.runs;
  const W = 640, H = 200, P = 34;
  const max = runs[0].unbrandedTotal;
  const x = (i) => (runs.length === 1 ? W / 2 : P + (i * (W - 2 * P)) / (runs.length - 1));
  const y = (v) => H - P - (v / max) * (H - 2 * P);
  const pts = runs.map((r, i) => [x(i), y(r.unbrandedMentioned)]);
  const chart = `<svg class="spark" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Everyday questions that mention us, per check">
    ${[0, 0.5, 1].map((t) => `<line x1="${P}" x2="${W - P}" y1="${y(max * t)}" y2="${y(max * t)}" stroke="var(--line)"/><text x="${P - 8}" y="${y(max * t) + 4}" text-anchor="end">${Math.round(max * t)}</text>`).join('')}
    ${pts.length > 1 ? `<polyline points="${pts.map((p) => p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>` : ''}
    ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--accent)"/><text x="${p[0]}" y="${p[1] - 12}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${runs[i].unbrandedMentioned}</text><text x="${p[0]}" y="${H - 10}" text-anchor="middle">${date(runs[i].runAt)}</text>`).join('')}
  </svg>`;
  $('#pg-progress').innerHTML = head('Progress', 'The same questions, asked again after each round of work.', `<button class="btn p" id="rgo" ${S.liveAuditAvailable ? '' : 'disabled'}>Check again</button>`, 'Tools') + `
    <div class="g g21"><div class="card"><div class="ch">Everyday questions that mention us <span class="r">out of ${max}</span></div>${chart}<div class="small muted" id="rstatus">${S.liveAuditAvailable ? '' : runs.length === 1 ? 'One check so far. The next one shows the change.' : ''}</div></div>
      <div class="card"><div class="ch">Checks</div><table><tr><th>Date</th><th>Found</th><th>Change</th></tr>
      ${runs.map((r, i) => `<tr><td>${date(r.runAt)}</td><td><b>${r.unbrandedMentioned}</b>/${r.unbrandedTotal} ${r.label === 'REAL' ? MEASURED : ESTIMATE}</td><td>${i ? (r.unbrandedMentioned - runs[0].unbrandedMentioned >= 0 ? '+' : '') + (r.unbrandedMentioned - runs[0].unbrandedMentioned) : '–'}</td></tr>`).join('')}</table></div></div>`;
  $('#rgo')?.addEventListener('click', async () => {
    $('#rgo').disabled = true;
    await fetch('api/audit/run', { method: 'POST' });
    const t = setInterval(async () => {
      const j = await (await fetch('api/audit/status')).json();
      $('#rstatus').textContent = j.running ? `Asking ${j.done} of ${j.total}…` : j.error ? 'Error: ' + j.error : 'Done';
      if (!j.running) { clearInterval(t); load(); }
    }, 2000);
  });
}

async function load() {
  S = await (await fetch(STATIC ? 'state.json' : 'api/state')).json();
  latest = S.runs[S.runs.length - 1];
  nav();
  $('#foot').textContent = STATIC ? 'Demo copy' : '';
  $('#when').textContent = `Last check ${date(latest.runAt)}`;
  renderOverview(); renderCities(); renderActions(); renderPost(); renderEvents(); renderMaterials(); renderFinder(); renderProgress();
  go();
}
load();
</script>
</body>
</html>
